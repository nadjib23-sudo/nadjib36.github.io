<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NADJIB 36</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  
  html, body { 
    width: 100%;
    height: 100vh;
    max-width: 100vw;
    overflow-x: hidden;
    background: #0a0a0b; 
    color: #c8ced8;
    font-family: 'Archivo', system-ui, sans-serif;
  }

  a {
    text-decoration: none;
    color: inherit;
    transition: color 0.2s ease;
  }
  a:hover {
    color: #fff;
  }

  .hero-container {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    background: #0a0a0b;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  /* VIDEO BACKGROUND */
  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 60%;
    pointer-events: none;
    z-index: 1;
  }

  /* OVERLAY GRADIENT */
  .hero-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(8,8,10,0.55) 0%, rgba(8,8,10,0.15) 30%, rgba(8,8,10,0.25) 55%, rgba(8,8,10,0.92) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* BRAND HEADER */
  #brand { 
    position: relative;
    z-index: 3;
    text-align: center; 
    padding: 16px 24px; 
    margin-top: 20px;
    background: rgba(14, 17, 22, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #brand img { 
    width: 32px; 
    height: 32px; 
    border-radius: 50%;
    vertical-align: middle; 
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  #brand b { 
    font-size: 16px; 
    font-weight: 700; 
    letter-spacing: 0.16em;
    color: #e6ebf2; 
    vertical-align: middle; 
  }

  /* UI CARD WRAPPER */
  #wrap { 
    position: relative;
    z-index: 3;
    padding: 32px; 
    margin-bottom: 50px;
    background: rgba(10, 10, 11, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    text-align: center;
    width: 90%;
    max-width: 460px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }

  #state { 
    font-size: 24px; 
    font-weight: 800; 
    margin: 0 0 12px; 
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #det { 
    font-size: 14px; 
    color: #a0aab8; 
    margin: 0 0 12px; 
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    display: inline-block;
  }

  #det b { 
    color: #ffffff; 
    font-weight: 600; 
  }

  #cache { 
    font-size: 13px; 
    color: #717d8d; 
    margin: 0; 
    min-height: 18px; 
    font-weight: 500;
  }

  #cache.cacheok, .ok { color: #7fd0a0; } 
  .bad { color: #ff6b6b; } 
  .warn { color: #ffd166; }
</style>

<script>
// Continuous Video Playback Enforcer
(function() {
  var video = document.getElementById("bgVideo");
  if (!video) return;

  function safePlay() {
    var promise = video.play();
    if (promise !== undefined) {
      promise.catch(function() {
        // Swallow rejection errors silently
      });
    }
  }

  // Initial attempt
  safePlay();

  // Event driven playback safety
  var events = ["pause", "ended", "loadedmetadata", "canplay"];
  events.forEach(function(evt) {
    video.addEventListener(evt, safePlay, false);
  });

  // Resume on tab refocus
  document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
      safePlay();
    }
  }, false);

  // Watchdog interval (runs every 1 second)
  var intervalId = setInterval(function() {
    if (video.paused) {
      safePlay();
    }
  }, 1000);

  // Clean up on unload (if applicable)
  window.addEventListener("unload", function() {
    clearInterval(intervalId);
  });
})();

// Original Jailbreak Logic
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
